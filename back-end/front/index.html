<!DOCTYPE html>
<html lang="pt_BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <h1>Cardápio</h1>

    <select id="filtro">
        <option value="">Todas as categorias</option>
        <option value="Hamburguer">Hamburguer</option>
        <option value="Salgados">Salgados</option>
    </select>

    <ul id="lista"></ul>
    <p id="msg"></p>

    <h2>Novo Produto</h2>
    <form id="form">
        <input type="text" id="nome" placeholder="Digite o nome do produto...">
        <input type="number" id="preco" placeholder="Digite o preço do produto...">
        <input type="text" id="categoria" placeholder="Digite a categoria do produto...">
        <input type="text" id="estoque" placeholder="Digite o estoque do produto...">
        <button>Cadastrar Produto</button>
    </form>

    <script src="js/script.js"></script>
</body>

</html>
